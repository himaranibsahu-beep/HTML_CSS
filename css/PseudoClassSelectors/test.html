<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .first-child {
            color: blue;
        }
        p:first-child{
            color: blueviolet;
            font-size: 25px;
        }
        h4:last-child{
            color: aqua;
        }
        p:nth-child(3){
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="first-child">Header 1</h1>
    <p>para 1</p>
    <div>
        <p class="first-child">para 2</p>
        <h3>header 2</h3>
        <p>para 3</p>
        <section>
            <p class="first-child">hiiiiii</p>
            <h4>hello</h4>
        </section>
        <p>para 4</p>
        <h4>byeeee</h4>
    </div>
    <p>para 5</p>
</body>
</html>
