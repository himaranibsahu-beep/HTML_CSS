<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Box Table</title>

    <style>
        .container {
            width: 500px;
            height: 500px;
            position: relative;
        }

        .box {
            width: 120px;
            height: 120px;
            background-color: green;
            border-radius: 20px;
            position: absolute;
        }

        .box-1 {
            top: 20px;
            left: 20px;
        }

        .box-2 {
            top: 20px;
            left: 280px;
        }

        .box-3 {
            top: 150px;
            left: 150px;
        }

        .box-4 {
            top: 280px;
            left: 20px;
        }

        .box-5 {
            top: 280px;
            left: 280px;
        } 
    </style>
</head>

<body>

    <div class="container">

        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
        <div class="box box-4"></div>
        <div class="box box-5"></div>

    </div>

</body>

</html>
