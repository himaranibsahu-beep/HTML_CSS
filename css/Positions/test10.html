<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
    <style>
        .container {
            background-color: black;
            height: 500px;
            width: 500px;
            position: relative;
        }

        .items {
            height: 100px;
            width: 100px;
            background-color: yellow;
            border: 2px solid red;
        }

        .item-1 {
            background-color: blue;
            top: 0px;
            left: 0px;
            z-index: 0;
        }

        .item-2 {
            background-color: chartreuse;
            top: 50px;
            left: 30px;
            z-index: 1;
        }

        .item-3 {
            background-color: crimson;
            top: 40px;
            left: 40px;
            z-index: 2;
        }

        .item-4 {
            background-color: forestgreen;
            top: 60px;
            left: 60px;
            z-index: 3;
        }

        .item-5 {
            
            background-color: pink;
            top: 100px;
            left: 100px;
            z-index: 4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items item-1">
            item-1
        </div>
        <div class="items item-2">
            item-2
        </div>
        <div class="items item-3">
            item-3
        </div>
        <div class="items item-4">
            item-4
        </div>
        <div class="items item-5">
            item-5
        </div>
    </div>
</body>

</html>
