<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        .con {
            height: 300px;
            width: 330px;
            background-color: antiquewhite;

        }

        .child {
            height: 50px;
            width: 160px;
            background-color: red;

            position: relative;
            top: 10px;
            left: 0px;
        }

        .child-1 {
            height: 100px;
            width: 100px;
            background-color: green;

            position: relative;
            left: 160px;
            top: -40px;
        }

        .child-2 {
            height: 100px;
            width: 100px;
            background-color: yellow;

            position: relative;
            top: -40px;
            left: 160px;
        }

        .child-3 {
            height: 50px;
            width: 170px;
            background-color: blue;

            position: relative;

            right: -160px;
            top: -40px;
        }

        .child-4 {
            height: 100px;
            width: 100px;
            background-color: yellow;

            position: relative;
            left: -0px;
            top: -100px;
        }

        .child-5 {
            height: 100px;
            width: 100px;
            background-color: green;

            position: relative;
            left: 0px;
            top: -300px;

        }
    </style>
</head>

<body>
    <h1>Positions Static</h1>
    <div class="con">
        <div class="child"></div>
        <div class="child-1"></div>
        <div class="child-2"></div>
        <div class="child-3"></div>
        <div class="child-4"></div>
        <div class="child-5"></div>
    </div>

</body>

</html>
