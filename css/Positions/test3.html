<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        .con {
            height: 300px;
            width: 300px;
            background-color: antiquewhite;

        }

        .child {
            height: 100px;
            width: 100px;
            background-color: yellow;

            position: relative;
            top: 0px;
            left: 0px;
        }

        .child-1 {
            height: 100px;
            width: 100px;
            background-color: green;

            position: relative;
            left: 100px;
        }

        .child-2 {
            height: 100px;
            width: 100px;
            background-color: blue;

            position: relative;
            top: 0px;
            left: 0px;
        }

        .child-3 {
            height: 100px;
            width: 100px;
            background-color: pink;

            position: relative;

            left: 200px;
            top: -100px;
        }

        .child-4 {
            height: 100px;
            width: 100px;
            background-color: orange;

            position: relative;
            left: 200px;
            top: -400px;
        }
    </style>
</head>

<body>
    <h1>Positions Static</h1>
    <div class="con">
        <div class="child"></div>
        <div class="child-1"></div>
        <div class="child-2"></div>
        <div class="child-3"></div>
        <div class="child-4"></div>
    </div>

</body>

</html>
