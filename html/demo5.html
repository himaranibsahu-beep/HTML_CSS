<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>Inline Form </h1>
    <form>
        <label>Username</label>
        <input type="text">
        <label>Password</label>
        <input type="password">
        <input type="submit">
    </form>

     <h1>Horizontal Form </h1>
    <form>
        <label>Username</label>
        <input type="text">
        <br/>
        <label>Password</label>
        <input type="password">
        <br/>
        <input type="submit">
    </form>

     <h1>Vertical Form </h1>
    <form>
        <label>Username</label>
        <br/>
        <input type="text">
        <br/>
        <label>Password</label>
        <br/>
        <input type="password">
        <br/>
        <input type="submit">
    </form>
</body>
</html>
