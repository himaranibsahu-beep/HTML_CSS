<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        ol li::marker {
            content: '=>';
            color: red;
        }

        ul li::marker {
            content: '!';
            color: blue;
        }
    </style>
</head>

<body>
    <h1>ordered list</h1>
    <ol type="a" start="3">
        <li>oil</li>
        <li>surf Excel</li>
        <li>masala</li>
        <li>suger</li>
    </ol>

    <h1>unordered list</h1>
    <ul>
        <li>oil</li>
        <li>surf Excel</li>
        <li>masala</li>
        <li>suger</li>
    </ul>

    <h1>Description lists</h1>
    <dl>
        <dt>chicken Biriyani</dt>
        <dd>we have dum biriyani</dd>

        <dt>Samantha</dt>
        <dd>She was pretty..</dd>
    </dl>
</body>

</html>
